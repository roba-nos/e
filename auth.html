<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - إيميل كوبرا</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at center, #0a0f2b 0%, #020617 100%);
            min-height: 100vh;
        }

        .auth-master-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 40px 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 520px;
            animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .auth-card {
            padding: 45px 35px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.6);
        }

        .auth-logo-large {
            text-align: center;
            margin-bottom: 35px;
        }

        .auth-logo-large i {
            font-size: 50px;
            background: linear-gradient(135deg, var(--primary-color), #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(99, 102, 241, 0.4));
            margin-bottom: 12px;
        }

        .auth-logo-large h1 { font-size: 26px; font-weight: 900; }

        .auth-tabs-v3 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn-v3 {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
        }

        .tab-btn-v3.active {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .input-v3-group {
            margin-bottom: 15px;
            position: relative;
        }

        .input-v3-group i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-color);
            font-size: 16px;
            opacity: 0.7;
        }

        .input-v3-group input {
            width: 100%;
            height: 56px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0 45px 0 20px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .input-v3-group input:focus {
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.06);
        }

        .forgot-pass-link {
            display: block;
            text-align: left;
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            margin-top: -5px;
            margin-bottom: 20px;
            transition: 0.2s;
        }
        .forgot-pass-link:hover { color: var(--primary-color); }

        .auth-btn-v3 { width: 100%; height: 56px; font-weight: 800; }

        .auth-view-v3 { display: none; }
        .auth-view-v3.active { display: block; animation: slideUp 0.3s ease; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .auth-footer-v3 { margin-top: 30px; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 20px; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo-area" onclick="window.location.href='index.html'" style="cursor: pointer;">
            <i class="fa-solid fa-staff-snake logo-icon" style="color: #22c55e; font-size: 24px;"></i>
            <h2 style="font-size: 18px; font-weight: 600; letter-spacing: -0.5px;">إيميل <span style="color: #22c55e;">كوبرا</span></h2>
        </div>
        <div class="nav-status">
            <a href="index.html" class="auth-btn"><i class="fa-solid fa-bolt"></i> البريد المؤقت</a>
        </div>
    </header>

    <div class="auth-master-wrapper">
        <div class="auth-container">
            <div class="auth-card glass-panel">
                
                <div class="dash-logo" onclick="window.location.href='index.html'" style="cursor: pointer;">
                <i class="fa-solid fa-staff-snake" style="color: #22c55e; font-size: 20px;"></i>
                <h2 style="font-size: 16px; font-weight: 600;">إيميل <span style="color: #22c55e;">كوبرا</span> برو</h2>
            </div>

                <div class="auth-tabs-v3" id="mainAuthTabs">
                    <button id="tabLogin" class="tab-btn-v3 active">تسجيل الدخول</button>
                    <button id="tabRegister" class="tab-btn-v3">إنشاء حساب جديد</button>
                </div>

                <!-- Login View -->
                <div id="loginView" class="auth-view-v3 active">
                    <div class="input-v3-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني (إيميلك الحقيقي)">
                    </div>
                    <div class="input-v3-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="كلمة المرور">
                    </div>
                    <a href="#" id="forgotPassTrigger" class="forgot-pass-link">نسيت كلمة المرور؟</a>
                    <button id="submitLoginBtn" class="primary-btn auth-btn-v3">
                        <i class="fa-solid fa-right-to-bracket"></i> دخول إلى حسابي
                    </button>
                </div>

                <!-- Register View -->
                <div id="registerView" class="auth-view-v3">
                    <div class="input-v3-group">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="regFullName" placeholder="الاسم الكامل">
                    </div>
                    <div class="input-v3-group">
                        <i class="fa-solid fa-at"></i>
                        <input type="email" id="regPlatformEmail" placeholder="البريد الإلكتروني">
                    </div>
                    <div class="input-v3-group">
                        <i class="fa-solid fa-shield-halved"></i>
                        <input type="password" id="regPlatformPassword" placeholder="كلمة مرور قوية للحساب">
                    </div>
                    <button id="submitRegBtn" class="primary-btn auth-btn-v3">
                        <i class="fa-solid fa-user-plus"></i> إنشاء عضوية كوبرا
                    </button>
                </div>

                <!-- Forgot Password View -->
                <div id="forgotView" class="auth-view-v3">
                    <h3 style="text-align: center; margin-bottom: 10px;">استرجاع الحساب</h3>
                    <p style="text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 20px; line-height: 1.6;">
                        أدخل بريدك الإلكتروني المسجل وسنقوم بالبحث عنه في السجل المحلي.
                    </p>
                    <div class="input-v3-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="forgotEmail" placeholder="أدخل بريدك هنا">
                    </div>
                    <button id="submitForgotBtn" class="primary-btn auth-btn-v3">
                        <i class="fa-solid fa-magnifying-glass"></i> ابحث عن حسابي
                    </button>
                    <p style="text-align: center; margin-top: 15px;">
                        <a href="#" id="backToLogin" class="back-link">العودة لتسجيل الدخول</a>
                    </p>
                </div>

                <div class="auth-footer-v3">
                    <a href="index.html" class="auth-btn" style="justify-content: center; width: 100%; height: 50px; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.1);">
                        <i class="fa-solid fa-bolt" style="color: var(--primary-color);"></i> استكشاف كزائر (بريد سريع)
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Config and Auth -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
