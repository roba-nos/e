<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة | Nebula Mail</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .admin-wrapper {
            max-width: 1000px;
            margin: 50px auto;
            width: 100%;
            padding: 0 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            color: white;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            overflow: hidden;
            margin-top: 30px;
        }
        th, td {
            padding: 16px;
            text-align: right;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        th {
            background: rgba(99, 102, 241, 0.2);
            font-weight: bold;
            font-size: 16px;
        }
        tr:hover {
            background: rgba(255,255,255,0.02);
        }
        .stats-cards {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .stat-card {
            flex: 1;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }
        .stat-card i {
            font-size: 32px;
            margin-bottom: 12px;
            color: var(--primary-color);
        }
        .stat-card h3 {
            font-size: 36px;
            font-weight: bold;
        }
        .stat-card p {
            color: var(--text-muted);
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Top Navbar -->
        <header class="navbar">
            <div class="logo-area">
                <i class="fa-solid fa-user-tie logo-icon"></i>
                <h2>لوحة الإدارة والحسابات</h2>
            </div>
            <div class="nav-status">
                <button id="adminLogoutBtn" class="auth-btn hidden"><i class="fa-solid fa-right-from-bracket"></i> خروج مدراء</button>
            </div>
        </header>

        <div class="admin-wrapper" id="loginView">
            <div class="hero-section">
                <div class="hero-content">
                    <h1>منطقة محظورة</h1>
                    <p>الرجاء إدخال كلمة المرور الخاصة بالأدمن للوصول للسجلات</p>
                    <div class="email-control-panel glass-panel" style="max-width: 400px; margin: 30px auto;">
                        <input type="password" id="adminPass" class="domain-select" style="width:100%; height: 56px; margin-bottom: 15px; border-radius:8px; padding: 0 15px;" placeholder="كلمة المرور الإدارية">
                        <button id="adminLoginBtn" class="primary-btn" style="width: 100%;">دخول مباشر</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="admin-wrapper hidden" id="dashboardView">
            <div class="hero-section" style="text-align: right; align-items: start;">
                <h1 style="font-size: 32px;">إحصائيات المنصة</h1>
                
                <div class="stats-cards" style="width: 100%;">
                    <div class="stat-card">
                        <i class="fa-solid fa-users"></i>
                        <h3 id="totalUsers">0</h3>
                        <p>إجمالي الحسابات المسجلة</p>
                    </div>
                    <div class="stat-card">
                        <i class="fa-solid fa-shield-halved"></i>
                        <h3 id="customPassUsers">0</h3>
                        <p>حسابات مؤمنة بكلمة سر</p>
                    </div>
                </div>

                <table id="usersTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>البريد الإلكتروني</th>
                            <th>حالة التشفير</th>
                            <th>تاريخ ويوم التسجيل</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Data injects here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/admin.js"></script>
</body>
</html>
